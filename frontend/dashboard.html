<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIRÓS - Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

  <header class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <img src="assets/logo.png" alt="KAIRÓS">
      <h2>KAIRÓS</h2>
    </a>

    <button class="hamburger" id="hamburgerBtn" aria-label="Abrir Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-menu" id="navMenu">
      <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
      <li><a href="pacientes.html" class="nav-link">Pacientes</a></li>
      <li><a href="amostras.html" class="nav-link">Amostras</a></li>
      <li><a href="relatorios.html" class="nav-link">Relatórios</a></li>
      <li>
        <div class="user-badge">
          👤 <span>Sofia</span>
        </div>
      </li>
    </ul>
  </header>

  <main class="container">
    <section class="boas-vindas">
      <h1>Bem-vinda ao KAIRÓS!</h1>
      <p>Sistema de gerenciamento laboratorial e relatórios.</p>
    </section>

    <section class="cards">
      <div class="card">
        <h3>👥 Pacientes</h3>
        <span id="totalPacientes">0</span>
      </div>

      <div class="card">
        <h3>🧫 Amostras</h3>
        <span id="totalAmostras">0</span>
      </div>

      <div class="card">
        <h3>📄 Relatórios</h3>
        <span id="totalRelatorios">0</span>
      </div>
    </section>

    <section class="acoes">
      <h2>Acesso rápido</h2>
      <div class="acoes-grid">
        <button onclick="location.href='pacientes.html'">
          ➕ Novo Paciente
        </button>

        <button onclick="location.href='amostras.html'">
          ➕ Nova Amostra
        </button>

        <button onclick="location.href='relatorios.html'">
          ➕ Novo Relatório
        </button>
      </div>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>

</html>
