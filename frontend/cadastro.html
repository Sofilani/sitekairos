<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIRÓS - Criar Conta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

  <main class="container">
    <section class="cadastro-box">
      <img src="assets/logo.png" alt="Logo KAIRÓS" class="logo">
      <h1>Criar Conta</h1>
      <p class="descricao">Cadastre-se para acessar o sistema KAIRÓS</p>

      <form id="formCadastro" onsubmit="return false;">
        <div class="campo">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome completo" required autocomplete="name">
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Digite seu email" required autocomplete="email">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="new-password">
        </div>

        <button type="button" id="btnCadastrar">Cadastrar</button>
      </form>

      <p id="mensagem"></p>

      <p class="login-link-text">
        Já possui uma conta?
        <a href="index.html">Fazer Login</a>
      </p>
    </section>
  </main>

  <script src="js/cadastro.js"></script>
</body>

</html>
