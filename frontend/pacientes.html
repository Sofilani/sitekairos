<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIRÓS - Pacientes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pacientes.css">
</head>

<body>

  <header class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <img src="assets/logo.png" alt="KAIRÓS">
      <h2>KAIRÓS</h2>
    </a>

    <button class="hamburger" id="hamburgerBtn" aria-label="Abrir Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-menu" id="navMenu">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="pacientes.html" class="nav-link active">Pacientes</a></li>
      <li><a href="amostras.html" class="nav-link">Amostras</a></li>
      <li><a href="relatorios.html" class="nav-link">Relatórios</a></li>
      <li>
        <div class="user-badge">
          👤 <span>Sofia</span>
        </div>
      </li>
    </ul>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">👥 Gestão de Pacientes</h1>
      <button id="btnNovoPaciente">
        ➕ Novo Paciente
      </button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Data de Nascimento</th>
            <th>Sexo</th>
            <th>Observações</th>
          </tr>
        </thead>
        <tbody id="listaPacientes">
          <!-- Dados carregados via JS -->
        </tbody>
      </table>
    </div>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>Novo Paciente</h2>

      <div class="modal-field">
        <label for="nome">Nome Completo</label>
        <input id="nome" type="text" placeholder="Digite o nome completo">
      </div>

      <div class="modal-field">
        <label for="data_nascimento">Data de Nascimento</label>
        <input id="data_nascimento" type="date">
      </div>

      <div class="modal-field">
        <label for="sexo">Sexo</label>
        <select id="sexo">
          <option value="Feminino">Feminino</option>
          <option value="Masculino">Masculino</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="modal-field">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" placeholder="Observações clínicas ou histórico"></textarea>
      </div>

      <div class="botoes">
        <button id="cancelar">Cancelar</button>
        <button id="salvar">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/pacientes.js"></script>
</body>

</html>
